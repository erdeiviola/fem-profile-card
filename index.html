<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Profile card component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <div class="base-container">
    
        <div class="card">
           <header class="header">
             
           </header>
           <main class="main">
              <img src="./images/image-victor.jpg" class="profile-photo" alt="profile-avatar"/>
              <div class="name-and-location">
                <h1 class="name">Victor Crest<span>  26</span></h1>
                <p class="location">London</p>
              </div>
              <hr/>
              <div class="stats">
                <div class="stat">
                  <h2>80K</h2>
                  <p class="stat-p">Followers</p>
                </div>
                <div class="stat">
                  <h2>803K</h2>
                  <p class="stat-p">Likes</p>
                </div>
                <div class="stat">
                  <h2>1.4K</h2>
                  <p class="stat-p">Photos</p>
                </div>
              </div>

           </main>
        </div>
    
    </div>
 
</body>
</html>
